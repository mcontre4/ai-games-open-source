name: Verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan history with redacted output
        run: docker run --rm -v "$PWD:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact=100 --log-opts=--all
      - name: Scan tracked files and bundled archives
        run: |
          mkdir "$RUNNER_TEMP/public-source"
          git archive HEAD | tar -x -C "$RUNNER_TEMP/public-source"
          docker run --rm -v "$RUNNER_TEMP/public-source:/repo:ro" ghcr.io/gitleaks/gitleaks:v8.30.1 dir /repo --redact=100 --max-archive-depth=2 --max-decode-depth=2
  verify:
    needs: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: pnpm/action-setup@v4
        with:
          version: '11.25.0'
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm dev:infra && pnpm setup:local && pnpm db:migrate
      - run: pnpm fixture:build && pnpm fixture:seed && pnpm sandbox:build
      - run: pnpm verify
      - if: always()
        run: pnpm stop:infra
